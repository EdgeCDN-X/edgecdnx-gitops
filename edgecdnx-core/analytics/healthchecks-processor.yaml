---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: healthcheck-processor
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        values:
          role: control
        selector:
          matchExpressions:
            - key: edgecdnx.com/control
              operator: In
              values:
                - "true"
                - "yes"
  template:
    metadata:
      name: healthcheck-processor
    spec:
      project: default
      sources:
        - chart: connect
          repoURL: https://charts.redpanda.com
          targetRevision: 3.1.0
          helm:
            releaseName: healthcheck-processor-v1
            valuesObject:
              env:
                - name: HEALTHCHECKS_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-cluster-app
                      key: fqdn-uri
              config:
                input:
                  nats:
                    urls:
                      - nats://nats-analytics-headless:4222
                    queue: preprocessor
                    subject: "healthchecks.1.>"
                  processors:
                    - unarchive:
                        format: json_array
                    - mapping: |
                        root = this.index(1)
                        root.source = this.index(1).tag.split(".").index(2)
                pipeline:
                  processors: []
                output:
                  sql_insert:
                    driver: postgres
                    dsn: "${HEALTHCHECKS_DB_URL}"
                    table: "healthchecks"
                    columns:
                      - start
                      - name
                      - type
                      - node
                      - location
                      - code
                      - message
                      - target
                      - alive
                      - duration
                      - source
                    args_mapping: root = [ (this.start.int64() / 1000000000.0).ts_format("2006-01-02T15:04:05.999999Z07:00", "UTC"), this.name, this.type, this.node, this.location, this.code, this.message, this.target, this.alive, this.duration, this.source ]
      destination:
        namespace: monitoring
        name: "{{ name }}"
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # Big CRDs.
      ignoreDifferences: []
