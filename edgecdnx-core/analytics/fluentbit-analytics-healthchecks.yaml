---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fluentbit-analytics-healthchecks
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        values:
          role: caching
        selector:
          matchExpressions:
            - key: edgecdnx.com/routing
              operator: In
              values:
                - "true"
                - "yes"
  template:
    metadata:
      name: fluentbit-analytics-healthchecks-{{ .name }}
    spec:
      project: default
      sources:
        - chart: fluent-bit
          repoURL: https://fluent.github.io/helm-charts
          targetRevision: 0.54.0
          helm:
            releaseName: fluentbit-analytics-healthchecks
            valuesObject:
              testFramework:
                enabled: false
              serviceMonitor:
                enabled: true
                selector:
                  release: edgecdnx-monitoring
              extraVolumes:
                - name: fluentbit-tls
                  secret:
                    secretName: edgecdnx-tls-analytics-{{ .name }}-client
              extraVolumeMounts:
                - name: fluentbit-tls
                  mountPath: /fluentbit/tls
                  readOnly: true
              config:
                inputs: |
                  [INPUT]
                      Name opentelemetry
                      Tag healthchecker
                      Listen 0.0.0.0
                      Port 4319

                filters: |
                  [FILTER]
                      Name record_modifier
                      Match healthchecker
                      Record location {{ .name }}

                  [FILTER]
                      Name         lua
                      Match        healthchecker
                      Call         process_otlp_attributes
                      Code         function process_otlp_attributes(tag, timestamp, group, metadata, record) local attributes = metadata["otlp"] and metadata["otlp"]["attributes"] if attributes and attributes["v"] ~= nil then record["v"] = tostring(attributes["v"]) end return 1, timestamp, metadata, record end

                  [FILTER]
                      Name rewrite_tag
                      Match healthchecker
                      Rule $v ^([0-9]+)$ healthchecks.$1.{{ .name }} false

                outputs: |
                  [OUTPUT]
                      Name forward
                      Match healthchecks.*
                      Host analytics.{{ .metadata.annotations.basedomain }}
                      Port 24224
                      tls On
                      tls.verify On
                      tls.ca_file /fluentbit/tls/ca.crt
                      tls.crt_file /fluentbit/tls/tls.crt
                      tls.key_file /fluentbit/tls/tls.key
      destination:
        namespace: monitoring
        name: "{{ .name }}"
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # Big CRDs.
      ignoreDifferences: []
