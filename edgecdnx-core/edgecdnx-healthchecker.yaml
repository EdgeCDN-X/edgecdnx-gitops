---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: edgecdnx-healthchecker
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        values:
          chart: healthchecker
          chartVersion: 0.3.3
          chartRepository: https://edgecdn-x.github.io/helm-charts/
          namespace: edgecdnx-routing
        selector:
          matchExpressions:
            - key: edgecdnx.com/routing
              operator: In
              values:
                - "true"
                - "yes"
  template:
    metadata:
      name: healthchecker-{{ .name }}
    spec:
      project: default
      sources:
        - chart: "{{ .values.chart }}"
          repoURL: "{{ .values.chartRepository }}"
          targetRevision: "{{ .values.chartVersion }}"
          helm:
            releaseName: healthchecker
            ignoreMissingValueFiles: true
            valuesObject:
              replicaCount: 2
              extraEnv:
                - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
                  value: "http://fluentbit-analytics-healthchecks-fluent-bit.monitoring.svc.cluster.local:4319/v1/logs"
              command:
                - /healthchecker
                - --leader-elect
                - --prometheus-endpoint=https://prometheus.{{ .metadata.annotations.basedomain }}
                - --prometheus-client-cert=/tls/tls.crt
                - --prometheus-client-key=/tls/tls.key
                - --prometheus-ca=/tls/ca.crt
              volumeMounts:
                - name: tls
                  mountPath: /tls
                  readOnly: true
              volumes:
                - name: tls
                  secret:
                    secretName: edgecdnx-tls-monitoring-{{ .name }}-client-healthchecker
      destination:
        namespace: "{{ .values.namespace }}"
        server: "{{ .server }}"
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # Big CRDs.
      ignoreDifferences: []
