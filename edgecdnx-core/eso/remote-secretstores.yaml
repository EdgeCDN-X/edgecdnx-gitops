---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clustersecretstores
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        flatList: true
  template:
    metadata:
      name: cluster-secret-stores
    spec:
      project: default
      sources:
        - chart: resource-thrower
          helm:
            releaseName: edgecdnx-mon-certs
            values: |
              resources:
              {{- range $cluster := .clusters }}
              {{- if eq $cluster.Name "in-cluster" }}
                - apiVersion: v1
                  automountServiceAccountToken: true
                  kind: ServiceAccount
                  metadata:
                    name: edgecdnx-reader
                - apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRoleBinding
                  metadata:
                    name: edgecdnx-reader
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: cluster-admin
                  subjects:
                  - kind: ServiceAccount
                    name: edgecdnx-reader
                    namespace: edgecdnx-controller-system
                - apiVersion: v1
                  kind: Secret
                  metadata:
                    name: upstream-in-cluster
                    annotations:
                      kubernetes.io/service-account.name: edgecdnx-reader
                  type: kubernetes.io/service-account-token
              {{- else }}
                - apiVersion: external-secrets.io/v1
                  kind: SecretStore
                  metadata:
                    name: {{ $cluster.Name }}
                  spec:
                    provider:
                      kubernetes:
                        remoteNamespace: edgecdnx-controller-system
                        server:
                          url: {{ $cluster.Server }}
                          caProvider:
                            type: Secret
                            name: cluster-{{ $cluster.Name }}
                            key: ca
                        auth:
                          token:
                            bearerToken:
                              name: cluster-{{ $cluster.Name }}
                              key: token
                - apiVersion: external-secrets.io/v1
                  kind: PushSecret
                  metadata:
                    name: cluster-{{ $cluster.Name }}-push
                  spec:
                    secretStoreRefs:
                      - name: {{ $cluster.Name }}
                        Kind: SecretStore
                    selector:
                      secret:
                        name: upstream-in-cluster
              {{- end }}
              {{- end }}
          repoURL: https://edgecdn-x.github.io/helm-charts
          targetRevision: 0.1.0
      destination:
        namespace: edgecdnx-controller-system
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # Big controller.
      ignoreDifferences: []
